name: Update Daily News

on:
  schedule:
    - cron: '0 23 * * *'  # 台灣時間每日 07:00 (UTC 23:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Fetch news
      run: python scripts/fetch_news.py
      
    - name: Generate content
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python scripts/generate_content.py
      
    - name: Commit and push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/news.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🦦 Update daily news - $(date +'%Y-%m-%d')" && git push)
